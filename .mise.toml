[tools]
go = "1.27"
air = "latest"

[env]
# Real values live in the gitignored .mise.local.toml. Each [[identity]] of kind "app" names its key's
# variable in `private_key_env`: either the PEM text (multiline TOML string) or a path to a 0600 file.
# The placeholder below matches config.toml.example; add one per App you declare.
MAGNUM_TALKABLE_APP_PRIVATE_KEY = "you-must-configure-this-in-your-.mise.local.toml"
# grep -E pattern of names that must never appear in tracked files (`make check-private`, part of `make test`).
MAGNUM_PRIVATE_PATTERNS = ""

[tasks.build]
description = "Build bin/magnum"
run = "go build -o bin/magnum ./cmd/magnum"

[tasks.test]
description = "Run the test suite with the race detector"
run = "go test -race ./..."

[tasks.dev]
description = "Rebuild and restart the daemon on save (unloads the launchd job; run `bin/magnum install` afterwards)"
run = """
bin/magnum daemon-stop --now 2>/dev/null || launchctl bootout "gui/$(id -u)/zhuravel.magnum" 2>/dev/null || true
exec air
"""

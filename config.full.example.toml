# A complete, working ~/.config/magnum/config.toml (Talkable's setup) as an example: the blocks a user
# writes and the few defaults this setup changes. Every other key, with its default and what it does, is in
# config.defaults.toml (embedded in the binary); set one here only to change it. App private keys are files
# next to the config (~/.config/magnum/keys/, chmod 600). Your config's [[watch]], [[identity]], [[pool]] and
# [[repo]] blocks are appended to the defaults, any key it sets under [daemon], [herdr], [terminal], [board],
# [github], [pipeline], [usage], [triage], [learn], [notes], [webhooks], [jira], [staging], [factory] or [kinds.<name>] overrides the default
# (the factory's roles and kinds merge by name, see config.defaults.toml), its [[role]] blocks
# override the role of the same name key by key (other names are appended), and its [spend.<level>] tables (the
# models and efforts of a [pipeline] spend level, per role) merge by level, role and key. `magnum roles` prints the
# effective roles and `magnum config` validates the result.
# Durations use Go syntax: "30s", "5m", "2h", with whole days in front: "7d", "1d12h".

[daemon]
default_repo = "talkable/talkable"    # what a bare PR number means (`magnum review 123`)
# observe_interval = "10s"        # read herdr for the turns in flight less often than the default 5s ("0" = only at
                                  # each poll_interval tick): a turn's end is then seen up to that much later

[terminal]
app = "iTerm2"                    # Terminal | iTerm2 | Ghostty | WezTerm | custom

[herdr]
review_session = "reviews"        # magnum's review panes in a herdr session of their own (`herdr --session reviews`);
                                  # the toasts and the slot guards still read yours

[notes]                           # repository notes: a curation organizes them and moves what it retires to the archive
curate = ["over_limit", "weekly", "misses"]  # curate a repository past its limits too (off by default), every repository
                                  # with notes once a week, and one whose retro found misses for its notes; review a
                                  # proposal with `magnum notes <repo> --review`

[board]
badges = { "Flagged" = "🚩", "Schema Migration" = { text = "\uf1c0", color = "yellow" } }   # 🚩 a flagged Jira issue; \uf1c0 = Nerd Font database icon
trackers = [                      # t on the PR board opens the first issue key of the title: {num} follows the key's prefix
  "https://talkable.atlassian.net/browse/PS-{num}",
  "https://talkable.atlassian.net/browse/PR-{num}",
]
# own_prs = "factory"             # your own open PRs on the factory screen alone (beside its tasks); "board" (the default) keeps them here

[jira]                            # hand the judge the Jira issue the PR's title or branch names, as ticket.md
url = "https://talkable.atlassian.net"   # the trackers above whose template starts with it name the issue
user = "alice@example.com"        # the Jira account's email
token_file = "keys/jira.token"    # its API token alone on one line, chmod 600 (relative: beside this config)

[staging]                         # which open PRs are live on the [[factory.repo.staging]] environments
mirror_dir = "/Volumes/External/magnum-staging"   # the treeless mirrors on an external disk (default <state dir>/staging);
                                  # while it is not mounted every status is unknown, and nothing is created there

[[identity]]
name = "zhuravel"
kind = "gh"
login = "zhuravel"
no_findings_event = "APPROVE"
# dismiss_own_stale_change_requests = true  # a re-review with no blocking finding dismisses this identity's own earlier
#                                           # CHANGES_REQUESTED review, which would otherwise keep blocking the author's
#                                           # merge. Default: true for kind = "app", false for "gh" (your own account's
#                                           # reviews stay unless you opt in); hand-posted change requests are never dismissed
# review_footer = ""                        # the footer magnum appends to every review this identity posts, once it
#                                           # is verified; default: magnum's (config.defaults.toml shows it); "" = none.
#                                           # A Go text/template of at most 2,000 characters, line breaks allowed: .SHA,
#                                           # .Short (10 characters), .Repo, .Number, .Login, .Simplify (the watch runs a
#                                           # role aliased simplify), .Clean (no findings, no simplifications), .Event
#                                           # (APPROVE, COMMENT or REQUEST_CHANGES), .PostMerge, .DeltaCheck, .QuietHours
#                                           # ([daemon] quiet_hours with the daemon's UTC offset; "" when unset),
#                                           # .DraftsSkipped (the watch's include_drafts = false) and .RequestLogin (whose
#                                           # review request starts a round: your login, the watch's poll login when a
#                                           # gh identity polls, else auto_approve_as's or the first gh identity's)

[[identity]]
name = "talkable-app"
kind = "app"
login = "talkable[bot]"
app_id = 2700610
client_id = "Iv23licS9bkgs7IGVSoS"
installation_id = 105365229
private_key_file = "~/.config/magnum/keys/talkable-app.pem"   # the App's PEM, chmod 600
no_findings_event = "COMMENT"
blocking_event = "REQUEST_CHANGES"
# dismiss_own_stale_change_requests = true  # the default for an app: false leaves a stale change request for a human to dismiss

# A GitHub App of the fixer's own (README, Fixing your own PRs): the fixer commits, pushes and replies as its bot
# instead of as you. No watch may review, poll or approve as it, and its tokens must be narrowed. One block per
# installation; a watch's fix_identity picks it.
# [[identity]]
# name = "example-fixer"
# kind = "app"
# login = "example-fixer[bot]"
# app_id = 1234567
# client_id = "Iv23liExampleFixer00"
# installation_id = 12345678
# private_key_file = "~/.config/magnum/keys/example-fixer.pem"
# token_repositories = ["talkable"]     # every token magnum mints for it reaches these repositories of the
#                                       # installation's account only (names, no owner)
# token_permissions = { contents = "write", pull_requests = "write" }   # and these permissions only: a fixer App
#                                       # needs exactly these two (metadata = "read" may be added)
# user_id = 123456789                   # its bot user's id (`gh api users/example-fixer[bot] --jq .id`): its commits'
#                                       # noreply email; `magnum identities check` checks it

[[watch]]
owner = "talkable"
include = ["talkable"]
identity = "talkable-app"             # who posts
poll_identity = "zhuravel"            # who polls (a gh identity)
skip_authors = ["dependabot"]
# skip_paths = ["docs/**", "**/*.md"]   # skip a PR when every changed file matches ("**" spans directories, "*" stays in one)
# request_teams = ["backend"]           # review requests for these team slugs start a round like one for you
# auto_approve = ["talkable"]           # repositories of the watch (or ["*"]) on whose PRs magnum posts YOUR approval
#                                       # once its review of the head found nothing to fix (default: none; README, Approving as you)
# auto_approve_as = "zhuravel"          # the gh identity of your own account (GitHub does not count an App's approval)
# auto_approve_body = "Approved after Magnum's review of {{.Short}}."   # one line: .Short (7 characters), .SHA, .ReviewURL, .Repo, .Number
# auto_approve_skip_authors = ["alice"] # logins whose PRs magnum never approves as you on its own (A still does)
# auto_approve_authors = ["rev-ann"]    # when set, the only logins whose PRs magnum approves as you on its own
#                                       # (the skip list still wins; a [[repo]] block's replaces it there)
# ignore_checks = ["Vendor Gates"]      # checks magnum treats as absent wherever it reads CI (a third-party
#                                       # app's check that fails on every PR); globs as required_checks
#                                       # (default: none; a [[repo]] block's adds to it)
# roles = ["codex-judge", "claude-review", "codex-review", "claude-simplify"]   # omitted or [] = every round role, the first judge only
# judge_own_pass = "after"              # [pipeline]'s "parallel" (the judge's own pass with the reviewers) or "after"
# related_lookback = "30d"              # [pipeline]'s 14d: how long a merged PR on the same paths stays related ("0s": none)
# related_ignore = ["**/*.lock", "db/schema.rb"]   # [pipeline]'s lockfiles: paths that never relate two PRs nor reach history.json
# status_comment = true                 # [pipeline]'s false: one comment per PR, edited in place, that says whether its review is
#                                       # scheduled (and why it waits), in progress or posted, with the factory's steps below on a
#                                       # PR a factory task published (README, Review status comment)
# autofix = "open"                      # [pipeline]'s "never": "own" starts a fix loop on your own PR after a review with
#                                       # findings; "open" on anything open on it once reviewers settle ([pipeline] settle_*,
#                                       # quiet_logins, quiet_markers; README, Fixing your own PRs)
# fix_identity = "example-fixer"        # the identity the fixer of this watch's PRs acts as (default: the fix role's,
#                                       # else poll_identity): your gh identity, or an App of the fixer's own above

[[pool]]
repo = "talkable/talkable"
main_clone = "~/Projects/talkable"
slot_name = "review{n}"           # slot names and paths are unique: two pools must not render the same one
slot_path = "~/Projects/talkable.review{n}"
min = 12
max = 18
idle_remove_after = "48h"
copy_files = ["mise.local.toml", "config/initializers/local.rb"]
strip_env = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
setup = ["bin/worktree-setup"]
teardown = ["bin/worktree-archive"]
schema_paths = ["db/"]
# reset_db loads the checkout's schema into the slot's databases before the reviewers when the files under
# schema_paths differ from those the databases were last loaded from (or the dev database's
# schema_migrations moved), as the first readiness commands (below), within 30m of its own (ready_timeout
# starts after it); a failure goes to the judge's prompt and never stops the round. A release keeps the
# databases as they are (reset_db_on_schema_change = false: it loads the base schema instead).
reset_db = [
  "DISABLE_DATABASE_ENVIRONMENT_CHECK=1 SKIP_TEST_DATABASE=1 FAKE_AWS=1 bin/rails db:schema:load",
  "DISABLE_DATABASE_ENVIRONMENT_CHECK=1 FAKE_AWS=1 RAILS_ENV=test bin/rails db:schema:load",
  "FAKE_AWS=1 bin/rails db:seed",
]
post_checkout = ["bundle check >/dev/null || bundle install --jobs 4", "pnpm install --frozen-lockfile"]
databases = [
  "talkable_development__{slug}", "talkable_development_reporting__{slug}",
  "talkable_development_shard_1__{slug}", "talkable_development_shard_1001__{slug}",
  "talkable_test__{slug}", "talkable_test_reporting__{slug}",
  "talkable_test_shard_1__{slug}", "talkable_test_shard_1001__{slug}",
]
# Readiness: run in the checkout before the reviewers of every round (`zsh -lc`, the slot's env), then
# the probes (exit 0 = ready), all within ready_timeout, then a check that the shell runs the Ruby the
# checkout pins. Failures go to the judge's prompt; they never stop the round.
# prepare = ["RAILS_ENV=test bin/rails db:test:prepare"]
# ready = ["RAILS_ENV=test bin/rails runner 'ActiveRecord::Base.connection.active?'"]
# ready_timeout = "5m"

  [pool.env]
  WT_BRANCH = "{slot}"            # selects the __review<n> databases (config/environment_constants.rb)
  CONDUCTOR_WORKSPACE_NAME = ""   # blank every name variable that outranks WT_BRANCH
  EMDASH_TASK_NAME = ""
  SUPERSET_WORKSPACE_NAME = ""
  COMMANDER_CONTEXT_NAME = ""
  CLAUDE_CODE_WORKTREE_NAME = ""
  WM_HANDLE = ""

# Per-PR worktrees (repos without a [[pool]]) run as workspace "magnum-pr-<N>": WT_BRANCH is exported to
# their hooks and agents, the outranking workspace-name variables are blanked, and the main clone's
# local mise file is rendered into them with GitHub tokens stripped. Without a [[repo]] block the main
# clone's .config/wt.toml hooks run ([post-create]/[post-start] after creation, [pre-remove] before
# removal). A [[repo]] block (the repo must be watched) supplies commands instead; see the README.
# Its no_findings_event and blocking_event override the posting identity's verdicts for the repo, and a
# block with only those, keep_approvals, stakes, max_simplifications, auto_approve_skip_authors,
# auto_approve_authors, allow_bot_authors, required_checks, ignore_checks, trackers, ci_dispatch,
# ci_dispatch_as and the readiness keys (prepare, ready, ready_timeout; each replaces the pool's) is valid
# for a [[pool]] repo too.
#
# [[repo]]
# repo = "your-org/your-app"
# no_findings_event = "COMMENT"           # APPROVE | COMMENT; default: the identity's
# blocking_event = "REQUEST_CHANGES"      # REQUEST_CHANGES | COMMENT; default: the identity's
# keep_approvals = false                  # true: keep an App's approval when the PR gets new commits
#                                         # (default: dismissed until the re-review posts; also on [[watch]])
# required_checks = ["ci / *"]            # checks a PR must pass to be ready; magnum reads GitHub's rulesets by
#                                         # itself, so set it only where GitHub will not tell (a private repo on a
#                                         # free plan) or to override; "workflow:<glob>" = every check of each
#                                         # Actions workflow whose file ("ci.yml") or declared name ("CI") it
#                                         # matches; the board shows their state, and the automatic approval
#                                         # counts only these checks (a failing check outside the list never holds
#                                         # it; without the key every check counts), one run per workflow file and
#                                         # name, a commit status apart from a check run of its name; with
#                                         # ci_dispatch set, one with no run on the head holds it (magnum approves
#                                         # once it ran and passed), and autofix = "open" never calls such a head
#                                         # green; without it such an entry leaves the decision to every check (a
#                                         # workflow its path filters skip); it never approves a PR that changes
#                                         # .github/workflows/ or .github/actions/ on its own
# ignore_checks = ["Vendor Gates"]        # added to the watch's list for this repository's PRs alone
# ci_dispatch = "ci.yml"                  # the workflow file that produces the required checks, for a CI that
#                                         # runs only when a PR opens: under autofix = "open" magnum starts it on
#                                         # the PR's branch, as ci_dispatch_as (else the watch's poll identity),
#                                         # once per head on an own PR whose required check did not run there
#                                         # (once nothing runs there, past settle_max), never on a PR that changes
#                                         # its own workflows or actions; it also makes a required_checks entry
#                                         # with no run at the head count as not run; default: none
# ci_dispatch_as = "zhuravel"             # the [[identity]] that starts ci_dispatch's workflow, where the poll
#                                         # identity cannot (GitHub answers HTTP 403, as to an App with Actions:
#                                         # read only); it needs Actions: write (an App, granted on its
#                                         # installation and in its token_permissions where it sets them; its
#                                         # token_repositories must name the repository) or push access and the
#                                         # repo scope (a gh login); validation refuses an App whose
#                                         # token_permissions leave actions = "write" out, but a dedicated fixer
#                                         # App (no watch reviews, polls or approves as it; token_permissions
#                                         # without actions) makes these calls over a token the daemon mints for
#                                         # them alone with Actions write added, never written to a file, so its
#                                         # panes never hold it; with or without ci_dispatch, it
#                                         # also reads the runs at an own PR's head and re-runs, once per head, a
#                                         # run that started no job (autofix = "open"); default: the watch's poll
#                                         # identity
# prepare = ["bin/rails db:test:prepare"] # readiness, as on [[pool]]
# ready = ["bin/rails runner 'ActiveRecord::Base.connection'"]
# ready_timeout = "5m"
# setup = ["bin/setup --database"]        # replaces wt.toml's post-create/post-start hooks
# teardown = ["bin/drop-database"]        # replaces wt.toml's pre-remove hooks; failures are logged
# copy_files = ["config/master.key"]      # copied from the main clone when present
# strip_env = ["STRIPE_SECRET_KEY"]       # dropped from the rendered local mise file
# wt_hooks = true                         # false: ignore .config/wt.toml without replacing it
#
#   [repo.env]                            # {slug} = magnum-pr-<N>, {path} = worktree, {clone} = main clone
#   DATABASE_NAME = "your_app_{slug}"

# The factory (`magnum factory`) works in a repository only when a [[factory.repo]] declares it. Its roles, kinds
# of task and their stages are in config.defaults.toml; the repository's copies, commands, precheck and staging
# environments are yours. The repository needs a [[watch]]: the local review runs the review roles of its watch.
# A copy is a checkout of its own, never a second [[pool]] of the repository: its copy_name and copies must not
# render a [[pool]] slot_name or slot_path.
#
# [[factory.repo]]
# repo = "talkable/talkable"
# base = "master"                          # tasks start here and the PR targets it; the factory never merges into it
# main_clone = "~/Projects/talkable"
# copies = "~/Projects/talkable.factory{n}"   # copy {n}'s checkout
# copy_name = "factory{n}"                 # its name (default factory{n})
# max_copies = 4                           # default: [factory] max_active
# min_free_disk_gb = 15                    # default: [daemon] min_free_disk_gb
# copy_files = ["mise.local.toml"]         # as on [[pool]]: copied from the main clone when present
# strip_env = ["GITHUB_PERSONAL_ACCESS_TOKEN"]
# setup = ["bin/worktree-setup"]           # after a copy is created
# post_checkout = ["pnpm install --frozen-lockfile"]
# reset_db = ["bin/rails db:schema:load"]
# databases = ["app_development__{slug}", "app_test__{slug}"]   # named like a pool's: the suffix is how copies' databases are told
# installs = [                             # run when the lock file differs from the copy's last install
#   { lock = "Gemfile.lock", run = "bundle install --jobs 4" },
#   { lock = "pnpm-lock.yaml", run = "pnpm install --frozen-lockfile" },
# ]
# server = "bin/worktree-run"              # starts the copy's local server
# env = { WT_BRANCH = "{copy}", PORT = "31{n}0", REDIS_DB_OFFSET = "{n*16}", REDIS_URL = "redis://127.0.0.1:6379" }
#                                          # {copy} (or {slot}): the copy's name, {n}: its number; PORT: the port of
#                                          # the copy's server, which [factory.repo.qa] needs: a port from 1024 to
#                                          # 65535 of its own for each copy;
#                                          # REDIS_DB_OFFSET named here is copy n's n*16, its 16 Redis databases, which
#                                          # a claim flushes on the Redis REDIS_URL (or REDIS_HOST, REDIS_PORT) names;
#                                          # keep them clear of the REDIS_DB_OFFSET of magnum's [[pool]] env
# reviewer = "your-reviewer-login"         # requested as the PR's reviewer once CI is green (a later milestone)
# error_skill = "error-tracker"            # the read-only skill an investigator reads the ticket's error through
# pr_body_skill = "example:create-pr"     # the skill the judge writes the PR's description with (your team's layout), a
#                                          # one-word name; none: the factory's own outline. The table from the ticket's
#                                          # points to their specs and the proof stay in it; the Known list is folded
# title_format = "[{key}] {title}"         # the layout of a PR's title: {key} is the task's issue key (Jira's or Linear's),
#                                          # {title} its title and is required, once; any other {word} is refused. Default
#                                          # "{key} {title}". A task with no key gets its title alone, whatever else the
#                                          # format says ("feat: {title}" gives "Title" to a keyless task); a title that
#                                          # already starts with the key keeps it once. Set it where the repository
#                                          # requires "[ABC-123] Title". On a Linear-
#                                          # tracked repository (a tracker link on linear.app, none on Jira) a prompt task
#                                          # asks "Which Linear issue is this (ABC-…)?"; the answer's key goes in its
#                                          # branch and, by this format, its PR's title
# ghost_marker = "<what a migration names the gh-ost environments with>"   # section 8.4 of the design: the migration-safety lint
# table_stats = "db/table_stats.json"      # the file (in the checkout) that lists each table's row count
# large_table_rows = 10000000              # a table this large needs gh-ost or an online algorithm
# consoles = ["kubectl exec", "bin/remote-console"]   # remote consoles that no factory command and no agent runs
# jira_moves = "shadow"                    # off (default) | shadow: the factory plans the moves of its tasks' Jira
#                                          # issues at their milestones and records them beside yours, writing nothing
#                                          # to Jira (ask and auto come after the shadow week); needs both moves and [jira]
# jira_move_start = { to = "In Development", from = ["To Do", "In Progress"] }   # when the coding stage begins
# jira_move_published = { to = "In Code Review", from = ["To Do", "In Progress", "In Development"] }   # at the publish;
#                                          # a move goes forward only, from a status of its from list; never to a
#                                          # done status; no move at the merge
# jira_comment = "shadow"                  # off (default) | shadow: the comment it would keep on the issue goes to
#                                          # the task's folder (jira-comment.md) at the start, the publish and the merge
#
#   [factory.repo.precheck]                # after the writer's last commit, and after each fix of the local review
#   lint = ["bundle exec rubocop --format emacs {files}", "yarn eslint --format unix {files}"]   # {files}: the changed
#                                          # files, shell-quoted; {base}: the base; offenses as path:line: on changed lines
#   specs = "bin/impact-specs {files}"     # the specs the change affects, with a baseline at the base
#   jest = "yarn jest --findRelatedTests {files}"
#   migrations = ["bin/rails db:migrate:up VERSION={version}", "bin/rails db:migrate:down VERSION={version}",
#                 "bin/rails db:migrate:up VERSION={version}"]   # each new migration, in order ({version}, {file}): up,
#                                          # down and up again; a gh-ost one is not run; db/schema.rb is put back after.
#                                          # A migration is a file directly in a db directory's child whose name
#                                          # holds "migrate" (the root's or an engine's, none under spec/ or test/),
#                                          # its name starting with its version. Without migration_databases only
#                                          # db/migrate's migrations run; one of another folder is listed and not run:
#                                          # "no databases are set for" its folder
#   # migration_databases = { "db/migrate" = ["primary"], "db/reporting_migrate" = ["reporting"],
#   #                         "db/sharded_migrate" = ["shard_1", "shard_1001"] }   # a multi-database app: each
#                                          # folder's databases, by the app's names. Each migration's commands then run
#                                          # on each database of its folder in turn (up, down, up on shard_1, then on
#                                          # shard_1001), each command bounded by cap on its own, and every command
#                                          # must hold {database}, its name:
#                                          # migrations = ["bin/rails db:migrate:up:{database} VERSION={version}", …];
#                                          # without the key none may. A folder it leaves out has no databases (its
#                                          # migrations are not run, and precheck.md, FLAGS and the PR body say so);
#                                          # one it names needs one database at least; {} is refused
#   cap = "10m"                            # a precheck stops after this long (default 10m), cap_per_file longer
#   cap_per_file = "15s"                   # for each file of the change (default 15s), cap_max at most (default
#   cap_max = "30m"                        # 30m, or cap when longer; never below cap nor cap_per_file). A cap
#                                          # that stops the specs or jest is a note: no fix turn, CI runs them;
#                                          # one that stops the lint needs you (it hangs). The red specs' base
#                                          # run (its cap grown from the red files) and the migrations (bounded
#                                          # by cap alone) run whatever the cap
#   skip_specs_for_kinds = ["chore"]       # a gem upgrade runs no specs
#
#   [factory.repo.qa]                      # visual QA of the change's pages in the copy's own server, by a kind's qa
#                                          # stage; none = no QA. Needs server and a PORT in env above
#   when = "bin/user-facing"               # reads the changed files on stdin, prints the user-facing ones (none: no
#                                          # QA); a failing command waits on you, never skips QA. Keep it a quick
#                                          # filter of paths: it has 30s, and nothing boots the app for it
#   url = "http://app.example.localhost:{port}"   # the copy's server; on this Mac (localhost, *.localhost, 127.0.0.1,
#                                          # ::1), with {port} as its port
#   ready = "/"                            # a 2xx or 3xx answer here says the server is up (default /)
#   skill = "example:qa"                   # the repository's QA skill, one word: the walker reads it for sign-in, test
#                                          # data and page conventions only (default none)
#   sign_in = "visit /dev/sign-in?as=qa@example.com"   # one line: how the walker signs in locally; never a
#                                          # password, name the env var that holds one (default none)
#   server_stop = "overmind kill"          # runs in the copy, at most 30s, before the server's process group is killed
#                                          # (default none); a stop then ends what of the copy still listens on its
#                                          # port, never a process outside it: one outside the copy on the port is
#                                          # left alone, and the stop counts as done
#   boot = "5m"                            # the server must answer ready within this (default 5m)
#   cap = "50m"                            # one run in all, the boot included (default 50m, at most 3h): keep it
#                                          # above boot plus the walker's timeout (fx-qa: 35m); the walker launches
#                                          # with --no-chrome and --disallowedTools for MCP tools and for open and
#                                          # osascript, bare or by their /usr/bin paths (config.defaults.toml); the
#                                          # rules do not reach inside `sh -c` or an interpreter, where the
#                                          # factory's shims, first on each command's PATH, refuse them
#   max_pages = 12                         # pages the walker captures at most (default 12, at most 30)
#   fixes = 2                              # writer turns for QA's defects before the task waits on you (1 to 5, default 2)
#
#   [[factory.repo.staging]]               # staging environments: a branch the factory merges into after your approval
#   name = "alpha"
#   branch = "staging-alpha"
#   qa = "qa"                              # the skill that tests it ("" = no QA)
#
#   [[factory.repo.staging]]
#   name = "beta"
#   branch = "staging-beta"                # merges and deploys, no QA
#
#   [[factory.repo.staging]]
#   name = "gamma"
#   branch = "staging-gamma"

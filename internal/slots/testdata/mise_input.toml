# copied from the main clone
min_version = "2024.9.5"

[tools]
node = "22"
python = [
  "3.12",
  "3.11",
]
ruby = { version = "3.3", install_env = { RUBY_CONFIGURE_OPTS = "--with-jemalloc" } }

[env]

FAKE_AWS = "1"
WT_BRANCH = "repo1"
GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_abcdefghijklmnopqrstuvwxyz0123456789"
#   GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_old0000000000000000000000000000000"
"CLOUDFLARE_TUNNEL_TOKEN" = """
ghp_multi000000000000000000000000000000
[not a table]
"""
NOTES = """
GITHUB_PERSONAL_ACCESS_TOKEN = "inside a string stays"
[still not a table]
"""
WIDGETS_API_KEY = 'x' # trailing comment
PORT = 3000
_.file = ".env"
_.path = ["bin", "node_modules/.bin"]
# a note from the team
# CLOUDFLARE_TUNNEL_HOST = "host"

[env.CONDUCTOR_WORKSPACE_NAME]
value = "from-conductor"

[shell_alias]
ttyd = "ttyd -W zsh"
GITHUB_PERSONAL_ACCESS_TOKEN = "not in [env], kept"

[settings]
jobs = 4
experimental = true

# CI for magnum. Four jobs:
#   - test:   on macOS (magnum is a macOS tool: launchd, AppleScript; its tests run where it runs), the gate
#             `make test` under the race detector with shuffled order (GOFLAGS carries the flags into the
#             gate, so the gate stays one definition; its tests run in the Makefile's TEST_TZ, and its
#             complexity ratchet lints the whole tree with the golangci-lint the setup puts on PATH) on
#             every package but internal/engine, the build, a smoke run of the built binary, an Intel
#             cross-compile and the landing scripts' selftest. The weekly run adds Go "stable" (Homebrew
#             builds the formula with its own, newest Go).
#   - engine: internal/engine under the race detector, shuffled, in two halves on runners of their own
#             (`make test-race` with -run ^TestA and -run ^Test[B-Z], the split the local gate uses), with
#             the same Go legs as test.
#   - stress: weekly and on demand, the scheduling-sensitive packages at GOMAXPROCS 1 and 3 (the runner has
#             3 vCPUs; a 16-core workstation hides these failures).
#   - static: on ubuntu (no macOS queue): modules verified and tidy, gofmt over every tracked .go file,
#             golangci-lint (only the issues a change adds, until the backlog is cleared), govulncheck for
#             darwin, and the docs/API.md drift check.
# Every job gets Go and golangci-lint from mise.toml through .github/actions/setup-environment (jdx/mise-action,
# then the Go module and build caches); mise.toml's [env] holds no secret, and an empty MAGNUM_PRIVATE_PATTERNS
# skips the private-name grep as an unset one did.
# Read-only token, no persisted credentials, timeouts; a new push to a PR cancels its older run, and every
# master commit keeps its own result.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "23 5 * * 1" # Mondays: a new Go release and vulnerabilities published since the last push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per PR (a new push replaces its run); any other event gets a group of its own.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Go ${{ matrix.go }})
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(github.event_name == 'schedule' && '["mise.toml","stable"]' || '["mise.toml"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          go-version: ${{ matrix.go == 'stable' && 'latest' || '' }}

      - name: gate under the race detector without internal/engine (complexity ratchet, gofmt, modules, vet, tests; the private-name checks skip without local patterns and registry)
        env:
          # The engine, which took 34 minutes and more here under -race beside the other 54 test binaries
          # (2100 s on 729bb7d5, past this step's 35m), runs in the engine job. -gcflags turns checkptr off for
          # the SQLite driver alone (Makefile RACE_GCFLAGS). The slowest binary left, internal/factory, took
          # 783 s beside the engine; 25m bounds one binary well before the job's 60 minutes, so a hang still
          # fails here with its goroutines' stacks.
          GOFLAGS: -race -gcflags=modernc.org/...=-d=checkptr=0 -shuffle=on -timeout=25m
        run: |
          pkgs="$(go list ./... | grep -v '/internal/engine$' | paste -sd ' ' -)"
          make test TEST_PKGS="$pkgs"

      - name: build
        run: make build

      - name: smoke (what the Homebrew formula's test checks; a CI runner has no live daemon)
        run: bin/magnum version | grep -E '^magnum [^ ]+$'

      - name: cross-compile for Intel Macs (the formula builds on both architectures)
        run: GOARCH=amd64 go build -o /dev/null ./cmd/magnum

      - name: landing scripts selftest (throwaway repositories under $TMPDIR, fakes for go, mise and magnum)
        run: .claude/skills/magnum-improve/scripts/selftest.sh

  engine:
    name: Engine (Go ${{ matrix.go }}, -run ${{ matrix.run }})
    runs-on: macos-latest
    # A half takes about 3.5 minutes at GOMAXPROCS 3 on a workstation (209 s and 175 s). Under -race the runner
    # was 2 to 3.3 times as slow (the engine's earlier times in the test job), so 7 to 12 minutes here;
    # -timeout 20m is 1.7 times the slowest, and the job's 30 minutes leave the panic with the hung goroutines'
    # stacks room after the setup and the race build.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go: ${{ fromJSON(github.event_name == 'schedule' && '["mise.toml","stable"]' || '["mise.toml"]') }}
        run: ["^TestA", "^Test[B-Z]"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment
        with:
          go-version: ${{ matrix.go == 'stable' && 'latest' || '' }}

      - name: internal/engine under the race detector, one half (TestEveryTestFallsInOneHalfOfTheRaceGatesSplit keeps every test in one)
        env:
          RUN: ${{ matrix.run }}
        run: make test-race PKGS=./internal/engine TESTFLAGS="-run=$RUN -shuffle=on -timeout=20m"

  stress:
    # Tests whose fakes race the round's goroutines pass on 16 cores and fail at GOMAXPROCS 1-3.
    # Weekly and on demand only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: Stress (GOMAXPROCS 1 and 3)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-environment
      - name: scheduling-sensitive packages, shuffled, twice
        run: go test -count=2 -cpu 1,3 -shuffle=on -timeout=30m ./internal/pipeline ./internal/engine ./internal/agents

  static:
    name: Lint, vulnerabilities, modules, API doc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # golangci-lint-action reads the PR's diff for only-new-issues
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-environment

      - name: modules verified and tidy
        run: |
          go mod verify
          go mod tidy -diff

      - name: gofmt (every tracked .go file)
        run: |
          out=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: golangci-lint
        # only-new-issues needs a diff, which the action gets only for a push or a PR; on the weekly and
        # manual runs it would report the whole backlog, so they skip this step until the backlog is cleared.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: darwin # lint the build magnum ships
        with:
          install-mode: none # the golangci-lint mise.toml pins, on PATH from the setup step
          only-new-issues: true

      - name: govulncheck
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          GOOS=darwin "$RUNNER_TEMP/bin/govulncheck" ./...

      - name: docs/API.md matches the exported API
        run: make api-doc-check

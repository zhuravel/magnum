# Dependabot: weekly update PRs for the Go modules and the actions of the CI workflow and its setup action.
# AGENTS.md asks for the latest dependencies; each update still goes through CI and the gate (`make test`)
# before it lands.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      # Bubble Tea, Lip Gloss, Bubbles and their helpers move together (Charm v2: charm.land/*).
      charm:
        patterns:
          - "charm.land/*"
          - "github.com/charmbracelet/*"

  - package-ecosystem: github-actions
    # "/" covers only .github/workflows; the composite setup action needs its own directory
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

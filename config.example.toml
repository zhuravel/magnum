# A minimal ~/.config/magnum/config.toml: copy it there, or let `magnum init` write it. It layers over the
# built-in defaults (config.defaults.toml, every key documented); config.full.example.toml is a worked
# setup and `magnum config` validates the result.

[daemon]
default_repo = "example/widgets"   # `magnum review 123` means example/widgets#123

[[identity]]
name = "me"
kind = "gh"                        # your gh login: polls GitHub and, here, posts the reviews
login = "your-login"

[[watch]]
owner = "example"
include = ["widgets"]              # repository globs; ["*"] watches the whole owner
identity = "me"                    # who posts; a GitHub App identity is in config.full.example.toml
poll_identity = "me"               # who polls: always a gh login
# clone_root = "~/Projects"        # where the clone is found or created; no [[pool]] needed

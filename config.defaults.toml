# magnum's built-in configuration: embedded in the binary (rebuild after editing), every key documented.
# Your settings do not go here: put them in ~/.config/magnum/config.toml ($XDG_CONFIG_HOME/magnum/config.toml
# when that is set; `magnum init` writes one). Its [[watch]], [[identity]], [[pool]] and [[repo]] blocks are
# appended, any key it sets under [daemon], [herdr], [terminal], [board], [github], [pipeline], [usage], [triage],
# [learn], [notes], [webhooks], [jira] or [kinds.<name>] overrides the value here, its [[role]] blocks override the role of the same
# name key by key (other names are appended), and its [spend.<level>] tables merge by level, role and key. App private keys are PEM files ([[identity]] private_key_file, by
# convention ~/.config/magnum/keys/<identity>.pem); only the older private_key_env reads one from an environment
# variable, e.g. from a checkout's gitignored mise.local.toml (the LaunchAgent then runs through `mise exec`).
# Durations use Go syntax: "30s", "5m", "2h", with whole days in front: "7d", "1d12h".

[daemon]
poll_interval = "30s"                 # how often magnum polls GitHub and observes herdr; must be positive
max_concurrent_reviews = 3        # review rounds running at once
max_total_working_codex = 5       # counts your own working Codex agents too
push_quiet_period = "5m"          # a new head is reviewable only after no push for this long (0 = at once; never negative)
min_rereview_interval = "30m"     # per PR, between review rounds
draft_min_rereview_interval = "2h"
own_min_rereview_interval = "0"   # the same for a PR you authored (one of your logins, the board's "mine"; "0" =
                                  # min_rereview_interval; an own draft waits the longer of this and the draft
                                  # interval; [[watch]] may override); a review request or `magnum review` skips it
max_rounds_per_pr_per_day = 12    # automatic rounds only: requested and forced rounds never count, and rounds
                                  # magnum cut short (a restart, an error before any prompt, a prompt that did
                                  # not render) are refunded
close_grace = "10m"               # wait after CLOSED/MERGED before releasing (covers reopen; 0 = release at once)
# reviewer_timeout = "40m"        # the turn timeout of a non-judge [[role]] that sets no timeout of its own, and
# judge_timeout = "90m"           #   judge_timeout a judge's; a role's own timeout wins, and the seven [[role]]
                                  #   blocks below set theirs, so these change only roles you add without one
                                  #   (`magnum config` warns when they change nothing); to change a built-in
                                  #   role's, set timeout in a [[role]] block of its name in your config
agent_start_stagger = "15s"       # agent launches start at least this far apart, across rounds (and at most 3
                                  # Codex launches at once)
min_warm = "30m"                  # a pool slot another PR holds is taken back for a waiting PR (its sessions parked,
                                  # the slot released) only once unused this long, with no human typing, no
                                  # session working, blocked or prompted within it, no run and no pin
human_cooldown = "15m"            # after you type into a magnum pane
reconcile_interval = "10m"          # reconcile and prune; must be positive (0 would stop the retention below)
default_repo = ""                 # "owner/name": lets `magnum review 123` omit the repository (set it in your config)
min_free_disk_gb = 15                # a slot or worktree needs this much free disk (0 = no check)
keep_events = "30d"               # audit events older than this are pruned on every reconcile ("0" keeps all); the step
                                  # rows a checkout resumes from are kept only while their subject has an event inside it
keep_requests = "7d"              # handled CLI requests older than this are pruned the same way
max_round_restarts = 2            # a push while the reviewers run restarts them on the new head (0 = never)
burst_quiet_period = "15m"        # replaces push_quiet_period after a burst of pushes:
burst_pushes = 3                  #   this many head changes (0 = off)
burst_window = "30m"              #   within this window up to the last one ([[watch]] may override all three)
request_debounce = "1m"           # a review request for the operator's own login or a posting identity (or a
                                  # team in a [[watch]] request_teams), or a draft marked ready, starts a round
                                  # this long after it (and the last push), skipping the timing rules above and
                                  # the cap
reply_debounce = "3m"             # a reply on magnum's latest review (the PR author's review or comment, or a reply in
                                  # one of magnum's threads by the author or a repository owner, member or
                                  # collaborator; magnum's own logins never count) with no push
                                  # since the review starts a judge-only round this long after the last one: the
                                  # judge re-decides the threads and answers there, or posts a new review when its
                                  # verdict changes ("0" = replies start nothing; a push meanwhile wins: its
                                  # re-review reads them); such rounds skip the timing rules above and the cap
reply_min_interval = "2h"         #   and come at most once per PR and head this often
rereview_min_lines = 30           # an automatic re-review needs this many changed code lines since the review
rereview_max_wait = "2h"          #   (comments, blank lines, whitespace and docs do not count) or an added file;
                                  #   after a merge of the base branch or a rebase only the change in the PR's own
                                  #   diff counts; a smaller delta waits for more pushes or this long after its
                                  #   first push (0 lines = no threshold; [[watch]] may override both)
delta_check = true                # such a small delta (more than 0 code lines; a modified image or other binary
                                  #   file counts 0) gets a judge-only check after the quiet period instead of the
                                  #   wait and a full round; an App's approval stands until it posts, at most 1h
                                  #   (false = wait and re-review in full; [[watch]] may override)
model_limit_cooldown = "5h"       # a model capped on its own (health pattern model_limit) without a reset time
                                  # counts as limited this long; sessions use the kind's fallback_models meanwhile
# park_idle_after = "15m"         # park an agent of a reviewed or ineligible PR (a draft, a mute, a skip) once it
                                  # idled this long since its last turn and the end of the PR's last round, fix or
                                  # whiteboard job ("0" = never; a judge waits [pipeline] judge_fresh_after when that
                                  # is longer, and the agents past theirs park alone while another stays), and a
                                  # waiting PR's when its round is held by a pause, a drain or the daily cap, or is
                                  # more than this far off; the next round resumes them; pinned or held slots,
                                  # needs_attention and recent human activity keep them
# skip_trivial_deltas = ["comments", "whitespace", "docs", "base"]   # a push that changes only these since
                                  # the review is not re-reviewed: the review stands for the new head; "base" is a
                                  # push that merges the base branch (or rebases onto it) and leaves the PR's own
                                  # diff against it as it was ([] = re-review every push; a list without "base"
                                  # re-reviews base merges; [[watch]] may override; `magnum review` always runs)
# quiet_hours = "01:00-07:00"     # local "HH:MM-HH:MM" (start included, end excluded; "22:00-06:00" crosses
                                  # midnight): inside it first reviews, full re-reviews (a review request's too)
                                  # and continues of a paused turn wait for its end; a round of the judge alone (a
                                  # delta check, a reply round, a re-review of the reviewed head) still starts, so
                                  # do `magnum review` and the board's review keys, a round in flight finishes,
                                  # and the poll, auto-approval, the retro and curation go on
restart_on_new_build = false      # true: once a new bin/magnum on disk passes its config check, the daemon restarts
                                  # on it at the first tick with no round claiming, reviewing or verifying and no
                                  # notes curation or retro running (it exits for launchd to start the new build;
                                  # dispatch never stops for it; needs launchd)
shell_path = true                 # at its start the daemon asks your login shell for its PATH ($SHELL -ilc, 20s at
                                  # most) and appends the directories its own PATH lacks (launchd's stays first,
                                  # mise's shims still win), so its hooks and commands find what only your shell's
                                  # exports name (DBngin's mysql, psql, redis-server); false keeps launchd's PATH;
                                  # a change of your shell's PATH takes effect at the next daemon-restart; event
                                  # daemon.shell_path, `magnum status` shows the count; the CLI keeps its own PATH

[herdr]
socket = "~/.config/herdr/herdr.sock"
notify = true                     # toasts (false = none); a review you ask for toasts how it went
toast_every_review = false        # also toast every automatic review posted

[terminal]
app = "Terminal"                  # Terminal | iTerm2 | Ghostty | WezTerm | custom | any other app name (only brought
                                  # to the front with `open -a`); override in your config
session = "default"               # the herdr session `magnum open` focuses a client of, or opens one for
                                  # (`herdr --session <name>`)
launcher = ""                     # custom: template with {herdr} {args} {command}
reveal_on_attention = false       # true: when a PR needs you (an agent waits on a dialog, a round needs attention)
                                  # the daemon focuses its agent in herdr and brings the terminal's herdr client
                                  # forward, as `magnum open` does; at most once in 30 minutes per agent or cause
# mouse = true                    # board and dashboard: wheel, click, double-click, heading sort,
                                  # column drag, right-click menu; m toggles it live (default true)
icons = "unicode"                 # unicode | nerd (Nerd Font icons in their state's color, gh-dash's for verdicts
                                  # and checks: needs a Nerd Font) | ascii

[board]
# badges = { "Flagged" = "🚩" }     # GitHub label → what the PR board shows before the title (case and leading
                                  # emoji ignored: "Flagged" matches "🚩 Flagged"); the summary counts them; a
                                  # colored one: { "Schema Migration" = { text = "\uf1c0", color = "yellow" } }
                                  # (red, green, yellow, blue, magenta, cyan, gray)
# trackers = ["https://example.atlassian.net/browse/PS-{num}"]   # issue links: t on the PR board opens the
                                  # first issue key of the title ("[PS-38553] …") a template knows; {num} follows
                                  # the key's prefix (Linear: "https://linear.app/<workspace>/issue/ENG-{num}")
recent_closed = "24h"             # merged and closed PRs stay on the PR board this long, in a section after the
                                  # open ones (newest closed first, dimmed; "merged · unreviewed" in red when GitHub
                                  # merged a PR magnum still meant to review); "0" = off (--all lists every closed PR)
shimmer = true                    # a PR magnum approved that GitHub still blocks on your approval says "✔ needs you"
                                  # ("✔ lift your ✗" when your changes request is the only one) in a rainbow that
                                  # slides while it is on screen; false keeps the colors still (NO_COLOR: reverse video)

[github]
transport = "gh"                  # App JWT/token calls run as `gh api` (gh | direct); direct = Go net/http,
                                  # which Little Snitch blocks for a rebuilt, unsigned magnum binary
budget_floor = 500                # GraphQL points left of an identity's hourly budget below which no new round,
                                  # fix job, whiteboard, retro or notes curation that reads as it starts: they wait
                                  # for the budget's reset (shown as "github budget" on the board and in `magnum
                                  # status`). Running rounds finish; the poll keeps its own floor of 50. 0 = off
                                  # (0 to 5000). `magnum status` shows each identity's budget and its spenders.

# Webhooks: magnum-relay receives the GitHub App's webhook deliveries and keeps their ids and routing (repository,
# PR numbers, head SHA, never a title, body or comment). In shadow mode the daemon reads them, notes which PR or
# head each one hints at, and compares that with what the poll finds changed (head, state, draft, updatedAt) on
# the owners listed below: a change some event hinted at in the 5 minutes before it (or since the repository's
# previous poll) is announced, one with none is missed, and an event no change followed is early or noise. It
# changes nothing the daemon does: no PR row, no round, no GitHub read. `magnum status` shows the numbers.

[webhooks]
mode = "off"                      # off | shadow ("active", acting on the events, is not available yet)
# url = ""                        # the relay's base URL, https only; the events come from <url>/v1/events
# token_file = ""                 # the relay's bearer token, in a file of mode 0600 (relative: beside this config);
                                  # it goes to curl on stdin, never in argv or a log
# owners = []                     # the watch owners the App is installed on; others are never compared
wait = "25s"                      # how long a page waits for an event (the relay's long poll, at most 30s)
stale_after = "90s"               # no page for this long makes the stream unhealthy (longer than wait + 10s)

# Jira: a round reads the issue the PR names and hands it to the judge as ticket.md in the report directory, to
# check the description's stated scope and the PR's behaviour against what the issue asks. The issue key is the
# first one a [board], [[watch]] or [[repo]] tracker knows in the PR's title, else in its head branch, among the
# trackers whose template starts with url (a Linear tracker is never read). One read a round, through curl (the
# REST API v2): the summary, status, type, priority, labels, parent, description (the first 20,000 bytes) and the
# text custom fields named for acceptance criteria, requirements, the definition of done or scope (8,000 bytes
# each); never a comment, a person or an attachment. A failure is a round.ticket warning and the round goes on.
# Off without url. `magnum doctor` checks the token file (MAGNUM_LIVE_JIRA=1 also asks Jira whether it accepts it).

[jira]
# url = ""                        # the Jira site, https only: "https://example.atlassian.net"; "" = off
# user = ""                       # the Jira account's email
# token_file = ""                 # the account's API token alone on one line, in a file of mode 0600 (relative:
                                  # beside this config); it goes to curl on stdin, never in argv or a log

# [usage]                         # the Codex budget, read from Codex's own session files at most once a minute
# codex_soft = 80                 # at this % used, full re-reviews wait (first reviews, delta checks, replies,
                                  # review requests and `magnum review` still run; 0 = off)
# codex_hard = 95                 # at this % used, rounds that need Codex wait until it is below again (0 = off)
# codex_home = ""                 # "" = $CODEX_HOME, else ~/.codex

# Triage: before a round starts its agents, a cheap model reads the round's diff and says which reviewers it
# needs, so a one-line fix does not wake every reviewer. Magnum, not the model, holds the limits: only rounds
# with at most max_lines changed lines are asked (bigger ones run every role), the judge always runs, the
# model can only remove roles that have a `summary` (never add one, never touch a role without one), and
# any failure of the command (missing, non-zero exit, timeout, no readable answer) runs every role. Only
# first reviews and re-reviews are triaged: not continued rounds, evals, or rounds that name roles (`magnum
# review --role`). The decision is a round.triage event on the PR; prompts/README.md documents the prompt.

[triage]
enabled = false                   # ask a cheap model which reviewers a small diff needs (the judge always runs)
max_lines = 120                   # rounds with more changed lines (added + deleted) run every role, unasked
command = ["claude", "-p", "--model", "haiku", "--tools", "", "--no-session-persistence"]
                                  # gets the prompt on stdin; its stdout is the answer. Another CLI, as a Codex one:
                                  # ["codex", "exec", "--model", "<a cheap model>", "--sandbox", "read-only",
                                  #  "--ephemeral", "--skip-git-repo-check", "-"]
timeout = "2m"                    # a command that takes longer is killed and the round runs every role
prompt = "triage.md"              # in prompts_dir; the embedded copy when absent

# The retro, magnum's learning loop: after a PR closes, magnum collects what the other reviewers commented on
# it and drops what its own review already caught; a cheap interactive agent, tagged `learn`, classifies the
# rest in a herdr pane, and the real misses go to the registry's misses table (`magnum misses` lists them).
# The same agent reads the replies to magnum's own findings and says how the author answered each, and the
# answers go to the declines table (`magnum misses --declines`). With enabled = true it runs once a day,
# after daily_at; `magnum retro` forces one whether or not it is enabled. The prompt carries only paths,
# URLs and SHAs: the comments and replies are files, data written by other people, never instructions.
# prompts/retro.md is the embedded prompt.

[learn]
enabled = false                   # run the retro once a day (`magnum retro` runs one regardless)
daily_at = "07:00"                # local time, "HH:MM": the daily retro runs once the clock passes it
lookback = "7d"                   # PRs merged or closed within it are candidates
settle = "24h"                    # the daily retro and a plain `magnum retro` take a PR only once it closed this long
                                  # ago, so the reviews posted after it closed are in (0 = at once; shorter than
                                  # lookback); `magnum retro <ref>` takes the PRs it names whenever they closed
max_prs = 20                      # PRs classified per retro, the newest closed first
min_comment_chars = 20            # shorter comments are dropped
include_bots = false              # bot accounts other than magnum's count as reviewers
kind = "claude"                   # the classifying agent: a [kinds.<name>] that drives a session (not "shell")
model = "sonnet"                  # passed through the kind's `model` args ("" = the kind's own default model). "sonnet" is
                                  # the default of kind "claude" only: a config that sets another kind and no model
                                  # gets "" (that kind's default_model, else its CLI's own), and one that sets a
                                  # model keeps it. The agent is checked like a [[role]] (a kind without `model`
                                  # args cannot be given one)
effort = ""                       # passed through the kind's `effort` args ("" = none)
# args = []                       # appended to the agent's launch args
prompt = "retro.md"               # in prompts_dir; the embedded copy when absent
timeout = "20m"                   # per PR: a turn that takes longer is abandoned
# The self-improving loop: an editor agent drafts a change to the judge skill and the judge and Claude reviewer
# prompts from the general misses and the findings authors declined, in a git worktree of the checkout on a
# learn/<run> branch; magnum checks it, regenerates the golden files, runs the agents, pipeline and config tests
# and `make check-private`, and commits it there. Nothing is pushed; `magnum learn` lists the proposals. Every key
# is checked whether or not editor is on (`magnum learn --propose` runs one regardless). The gate then replays
# eval cases on the proposal (the learned cases of the inputs it answers first) against master's prompts and
# skill, in-process and below [usage] codex_soft, and passes, holds (for `magnum learn --review`: one that improves
# only declined findings too) or fails it. A passed proposal lands on the checkout's master as a local commit
# (fast-forward; held when master is not checked out, an operation is in progress, master no longer holds the
# base, the branch moved, the prompts do not render with the daemon's build, a rebase conflicts, a file it
# changes has uncommitted edits or the checkout leaves master during the fast-forward), and the daemon restarts on
# it. With editor on, the editor runs at most once a local day after a retro stored a new
# general miss of P0 to P2 or a general finding declined as wrong or over-ranked, once no other learn job (the
# retro, a notes curation, an edit, a gate) runs, no proposal waits, no round is in its judge stage, nothing
# pauses it and go runs in the checkout (`magnum doctor` says why it is off).
editor = false                    # run the editor after a retro that stored new general misses or declines
editor_kind = "claude"            # the editing agent: a [kinds.<name>] that drives a session; checked like a [[role]]
editor_model = "sonnet"           # as model above: "sonnet" for kind "claude", "" (the kind's default) for another kind
editor_effort = ""                # passed through the kind's `effort` args ("" = none)
# editor_args = []                # appended to the editor's launch args
editor_prompt = "skill-edit.md"   # in prompts_dir; the embedded copy when absent
editor_timeout = "45m"            # per turn: a turn that takes longer is abandoned
gate_cases = 6                    # eval cases the gate of a proposal replays at most (the inputs' own first)
land_per_day = 1                  # proposals that land per local day; a later passed one waits for the next day
restart = "idle"                  # after a landing: "idle" restarts the daemon once nothing is in flight, "manual"
                                  # asks for `magnum daemon-restart --when-idle`
regression_points = 10            # a landed version whose declined and argued share of its posted findings grows by
regression_min_findings = 20      #   this many points (1 to 100) over the previous version's, once each posted at least
                                  #   this many findings, gets one revert proposal, which the gate holds for review

# Repository notes (~/.local/share/magnum/notes/<owner>/<repo>.md and the harness directory of QA scripts
# beside it): every review role reads them first, the judge rewrites them. Every version is kept in the
# registry (`magnum notes <repo> --log`, `--diff`, `--restore`). The four limits are curation triggers, not
# caps: after each judge round and at startup magnum measures the notes, and a repository past any of them is
# marked for curation (a notes.over_limit event). Nothing blocks a review, and a curated proposal may stay
# above a limit when what it keeps helps future reviews of the repository.
[notes]
max_bytes = 16384                 # notes larger than this
max_line = 300                    # a line longer than this many characters; the judge prompts carry it as
                                  # notes_max_line and ask the judge to keep each notes line within it
max_harness_files = 15            # more harness files than this
max_harness_bytes = 131072        # a larger harness than this
curate = ["over_limit", "misses"] # what starts a curation besides `magnum notes <repo> --curate`: over_limit, a
                                  # marked repository once its notes changed since the last curation; weekly, every
                                  # repository with notes once a week once they changed; misses, a repository whose
                                  # retro recorded misses for its notes (class miss, scope repo), which every
                                  # curation takes. At most one curation of a repository a day. [] (or "off") = only
                                  # on demand. A curator agent proposes new notes and harness in a scratch copy;
                                  # nothing changes until you accept it with `magnum notes <repo> --review`
kind = "claude"                   # the curator: a [kinds.<name>] that drives a session (not "shell"), checked
model = "sonnet"                  # like a [[role]]; "sonnet" is the default of kind "claude" only, as in [learn]
effort = ""                       # passed through the kind's `effort` args ("" = none)
# args = []                       # appended to the agent's launch args
prompt = "notes-curate.md"        # in prompts_dir; the embedded copy when absent
timeout = "30m"                   # a curator turn that takes longer is abandoned

# The review pipeline ("a Procfile of agents"): [kinds.<name>] says how to drive an agent CLI, each
# [[role]] is one agent (or shell command) of a review round, a [[watch]]'s `roles` picks the roles it
# runs. Prompts are files in prompts_dir, loaded when the daemon starts, and so are the judge and fix skills,
# which it copies (an edit takes effect at the next `magnum daemon-restart`). The fix role and the whiteboard
# role are no part of a round: the fix job and the whiteboard job run them. prompts/README.md documents every key, the template variables
# and examples (a droid or omp role, a watch with two roles). `magnum roles` prints the effective roles per
# watch and `magnum roles --kinds` the kinds.

[pipeline]
prompts_dir = "{{repo}}/prompts"  # a prompt name reads prompts_dir/<name>, else magnum's built-in copy;
                                  # {{repo}} is the checkout magnum runs from, none for an installed binary
                                  # (built-in prompts; point it at e.g. ~/.config/magnum/prompts to override)
judge_own_pass = "parallel"       # the judge does its own pass (its own_pass prompt) while the reviewers work
                                  # and judges their reports once both ended; "after": one judge prompt after
                                  # the reviewers. A judge alone (delta check, continue) gets one prompt anyway
related_lookback = "14d"          # every judge prompt names related.json: the repository's open PRs, and those
                                  # merged within this long, that change this PR's paths ("0s": open PRs only);
                                  # never an open PR idle for 30 days, and after a review only the new ones
related_ignore = ["**/Gemfile.lock", "**/package-lock.json", "**/pnpm-lock.yaml", "**/yarn.lock", "**/bun.lock",
                  "**/go.sum", "**/poetry.lock", "**/uv.lock", "**/Pipfile.lock", "**/Cargo.lock", "**/composer.lock"]
                                  # paths that never make two PRs related (globs as skip_paths) and that
                                  # history.json (the changed files' last commits) and docs.json (the base's
                                  # .md pages that name them) leave out; [] = none
judge_fresh_after = "90m"         # a judge whose last turn on the PR ended longer ago starts the next round in a
                                  # fresh session (the recovery, which reads the earlier reviews and threads from
                                  # GitHub): Codex's prompt cache lasts about 1.5 h, so resuming re-reads the whole
                                  # conversation uncached. A live judge is quit first (parked, history kept); the
                                  # other roles keep their sessions; a continue resumes. "0" = always resume
full_pass_every = 10              # the Nth automatic re-review of a PR, counted since its first review or its
                                  # last full pass, is a full pass: every role starts in a fresh session and
                                  # reviews the whole PR as a first review does (the judge's own pass without
                                  # the earlier reviews), and the judge then re-decides the earlier threads.
                                  # Costs a first review's rounds of every role. A due one overrides a delta
                                  # check; a same-head or reply round and `magnum review` never become one
                                  # (`magnum review --full` asks for one; `--fresh` runs one when this or a
                                  # rule below makes one due). 0 = this rule off
full_pass_lines = 500             # also a full pass once the PR's re-reviews since its baseline (its last full
                                  # pass, else its first review) changed this many lines (added plus deleted,
                                  # lockfiles and related_ignore left out, a push that merged the base branch
                                  # counted by the PR's own diff), or a quarter of the PR's lines at the
                                  # baseline when that is more. 0 = this rule off
full_pass_files = 10              # likewise for the files those re-reviews touched, or a quarter of the PR's
                                  # files at the baseline when that is more. 0 = this rule off
full_pass_after = "12h"           # and once this long passed since the baseline, whatever the PR's size: the
                                  # first push of a workday gets a whole read. "0" = this rule off
audit_every = 5                   # the Nth automatic re-review of a PR, counted since its first review, its last
                                  # full pass or its last audit pass, is an audit pass while the PR's evidence map
                                  # holds unknown or stale areas: every session starts fresh, the reviewers
                                  # re-review the delta, and the judge first probes at most three of those areas
                                  # (the riskiest first) and one earlier probe again, each with a control. A delta
                                  # check, a same-head or reply round and `magnum review` never become one, and a
                                  # full pass due on the same round wins. 0 = never
approve_after_full_pass = 2       # a re-review of a PR with this many re-reviews or more since its last full pass
                                  # (else its first review) cannot approve: its clean verdict posts as a comment
                                  # whose body says "A full pass of the whole PR follows before approval.", and a
                                  # full pass of every role on the same head follows at once, which approves when
                                  # it finds nothing. A full pass, a post-merge review, a reply round and a CI
                                  # check never hold, nor does a repository where a clean review comments anyway
                                  # (no_findings_event COMMENT) and no auto_approve names it. 2 lets one round of
                                  # fixes approve on its delta. 0 = off
max_simplifications = 5           # how many of claude-simplify's proposals the judge posts at most, the most
                                  # substantial first, each proven by its own equivalence probe; 1 to 10. A
                                  # [[repo]] block's own wins
judge_fallback = "claude-judge"   # a judge role of another kind that takes over a PR's rounds once the judge's
                                  # kind refused one (Codex's cybersecurity classifier): the PR is flagged for
                                  # that kind, its roles of that kind are dropped, and this role judges from
                                  # then on, starting fresh through the recovery prompt. "" = a refused PR is
                                  # never reviewed again. "claude-judge" names the second judge below, which
                                  # runs for no watch otherwise. Unless you write the key, it is off for a
                                  # watch it does not fit (whose judge is claude-judge or another Claude judge,
                                  # or a base config without claude-judge); a value you write must fit.
                                  # [[watch]] may override
fix_role = "claude-fix"           # the fix role (fix = true) that fixes magnum's findings on your own PRs: the
                                  # fix job `magnum fix` runs it, in the PR's slot, as a role of its own that
                                  # takes no part in a review round. "" = no fix job. [[watch]] may override
                                  # (fix_role = "" there switches the job off for that watch)
fix_cycles = 3                    # fix runs one fix loop may take (a fix, then the re-review it forces) before
                                  # the PR needs you; at least 1. [[watch]] may override
autofix = "never"                 # never: a fix loop starts only when you ask for it (`magnum fix`, the board's f);
                                  # own: it also starts by itself after a review with findings on a PR one of
                                  # your logins authored, unless `magnum fix --off` took the PR out. Start by
                                  # hand for a first week, then switch. Post the reviews as an App identity
                                  # with own: the fixer's replies must not look like the reviewer's.
                                  # [[watch]] may override
fix_compact_at = 70               # before a fix cycle resumes the fixer's conversation, magnum reads how full its
                                  # context is from the pane's status line (the kind's context_pattern) and, at
                                  # or above this percent, sends /compact and waits for it to end, rather than
                                  # let Claude Code compact it by itself in the middle of a fix. A fixer resumed
                                  # from a park is read every 2 s for up to a minute, until its status line shows
                                  # a figure (once per PR: after a miss, later resumes read once, until a figure
                                  # was read); a live one is read once. A fixer still at or above it afterwards, or
                                  # whose /compact did not finish, is parked and the cycle starts it fresh (the fix
                                  # prompt carries the findings); a pane that shows no figure leaves the fixer as
                                  # it is and warns once per PR, said again only after a figure was read in
                                  # between. A fresh fixer is never compacted. 0 = off; at most 99
whiteboard = false                # true: writes a whiteboard (an interactive document in the dev.fast Whiteboard
                                  # app) of every PR after every review magnum posts on a new head, through
                                  # whiteboard_role, in the PR's slot. Needs dev.fast Whiteboard: Whiteboard
                                  # Desktop running, or `whiteboard server start`, and the `whiteboard` CLI on
                                  # PATH; a Whiteboard that is down skips the whiteboard, it does not wait.
                                  # [[watch]] may override
whiteboard_role = "claude-whiteboard"   # the role with whiteboard = true that writes it. "" = no whiteboard job,
                                  # by hand or automatic. [[watch]] may override
spend = "medium"                  # the spend level: how hard, and on which models, the roles think. medium = the
                                  # efforts the [[role]] blocks below write out; high = xhigh for every built-in
                                  # effort and rereview_effort (the strongest level both Codex and Claude take);
                                  # low = one notch down (xhigh to high, high to medium), medium the floor and ""
                                  # left empty. A key your own [[role]] block sets wins over that mapping, and a
                                  # role that is not built in keeps its own. Any other name is a level of your
                                  # own, declared by its [spend.<name>] table, and starts from medium. The active
                                  # level's table sets model, effort, rereview_effort or max_subagents per role
                                  # (a built-in role or one of your [[role]]s) over everything, your [[role]]
                                  # blocks included; a table spend does not name waits for later. In your config:
                                  #   [spend.high]
                                  #   codex-judge = { model = "gpt-6-astra", rereview_effort = "xhigh" }
                                  #   claude-review = { model = "fable", effort = "xhigh" }
                                  #   [spend.low]
                                  #   claude-review = { model = "sonnet", effort = "medium" }
                                  # A kind's own spend (spend in [kinds.codex] below, or any kind's) takes this
                                  # one's place for that kind's roles.
                                  # Read at startup: `magnum daemon-restart --drain` applies a change; `magnum
                                  # roles` shows the models and efforts
status_comment = false            # true: one comment on each PR magnum means to review, posted as the PR's
                                  # posting identity (the one the reviews use) and edited in place: a checklist
                                  # (Review queued for the head and why it waits, In progress, Posted) that
                                  # collapses to one line with the review's verdict and link once it posts,
                                  # one line when magnum will not review the head or its own failure stopped
                                  # the review, one that answers a review request on a muted or filtered-out
                                  # PR, and a last line when the PR is closed, merged or turned into a draft
                                  # before its review posted. Never posted on post-merge reviews or dry runs,
                                  # nor on a draft nobody asked to review; edited at most once every 2 minutes
                                  # (a last line at once). [[watch]] may override (status_comment = false there
                                  # keeps a watch quiet)
status_comment_note = ""          # a line of yours under the status comment while a review is queued, under way
                                  # or held (not under the posted line nor a last line), e.g. "Reviews by the
                                  # team's magnum."; "" = none

# Agent CLIs: codex, claude, droid and omp are built in (values below are their defaults); every key is
# optional and overrides only itself. Any other herdr agent kind (pi, gemini, ...) can be declared too.
#
# [kinds.codex]
# wrapper = "auto"                    # auto: probe `zsh -ic 'whence -w codex'` (your zsh function adds the
#                                     # flags, so magnum passes extras only); true | false (false appends args);
#                                     # bypass: `unset -f codex; unalias codex` in the pane before every launch
#                                     # and resume, so the binary runs with magnum's args alone (args appended;
#                                     # a flag your function adds, --search say, goes into start instead)
# start = []                          # always appended (launches and resumes; `codex review` has its own line):
#                                     # ["--search"] gives the sessions Codex's live web search, read-only and
#                                     # with no local browser, as Claude's sessions have their web tools
# args = ["--dangerously-bypass-approvals-and-sandbox"]  # appended only without a wrapper: a plain
#                                     # binary runs like the wrapper, without approval prompts or sandbox
#                                     # (magnum answers prompts No; a sandboxed judge cannot post); doctor
#                                     # fails a plain binary without it
# resume = ["resume", "{session}", "-c", "tui.resume_cwd=current"]   # the slot's directory, not the one the session
#                                     # recorded (Codex 0.162 asks otherwise, and magnum does not answer)
# model = ["--model", "{model}"]
# default_model = ""                  # the model of every codex role without its own `model`, passed through
#                                     # `model` args; e.g. "gpt-6.1-sol" makes the judge start with
#                                     # --model gpt-6.1-sol ("" = codex's own default; a role's model wins)
# effort = ["-c", "model_reasoning_effort={effort}"]
# spend = ""                          # the spend level of the codex roles (codex-judge, and codex-review through
#                                     # its tool) in place of [pipeline] spend: that level's notch and its
#                                     # [spend.<level>] table apply to them, e.g. "low" while Codex's week runs
#                                     # short and Claude's does not; built in or declared by a table, as for
#                                     # [pipeline] spend; "" = [pipeline] spend. Every kind takes it, and a
#                                     # [kinds.codex] block that sets only spend keeps the rest of the kind
# subagents = ["-c", "agents.max_concurrent_threads_per_session={subagents}"]   # a role's max_subagents: the
#                                     # spawned-agent threads open at once, the primary excluded (at least 1)
# no_subagents = ["-c", "agents.enabled=false"]   # max_subagents = 0: no multi-agent tools at all
# mcp_off = true                      # every launch and resume (and codex-review's line) passes mcp_strict and
#                                     # turns off each MCP server your Codex config.toml declares (the env's
#                                     # CODEX_HOME, else ~/.codex), one mcp_disable per server; false = they
#                                     # all load, the apps connector and the skills list too
# mcp_strict = ["-c", "features.apps=false", "-c", "skills.include_instructions=false"]   # Codex's built-in
#                                     # apps connector (codex_apps: ChatGPT's connectors), which no
#                                     # [mcp_servers] table declares, and your skills list in every turn;
#                                     # mcp_allow does not apply ([] keeps both on)
# mcp_allow = []                      # MCP servers mcp_off leaves on, e.g. ["docs"]
# mcp_disable = ["-c", "mcp_servers.{server}.enabled=false"]   # turns off server {server}
# plugin_allow = []                   # Codex plugins mcp_off leaves on, e.g. ["context7@claude-plugins-official"]
# plugin_disable = ["-c", "plugins.{plugin}.enabled=false"]   # turns off plugin {plugin} (name@marketplace): a
#                                     # plugin's MCP servers (the playwright plugin's browser, a docs or GitHub
#                                     # server) are no [mcp_servers] table, so every launch, resume and
#                                     # codex-review line passes this once per plugin installed in the Codex
#                                     # home's plugins/cache or declared by a [plugins."…"] table, except those
#                                     # set enabled = false there; [] leaves the plugins on
# project_untrust = ["-c", "projects={projects}"]   # when the PR changes the checkout's .codex/ or the
#                                     # AGENTS.md or AGENTS.override.md at its root (against its merge base,
#                                     # files a round left there included, or when git cannot tell), every
#                                     # launch, resume and codex-review line marks the checkout untrusted for
#                                     # that session ({projects}: a TOML table of its paths), so none of the
#                                     # PR's .codex/ loads (config, MCP servers, hooks, rules), nor AGENTS.md,
#                                     # and magnum answers Codex's "Folder access" with "Open restricted";
#                                     # [] = a changed .codex/ or AGENTS.md loads like any trusted project's
# project_docs_off = ["-c", "project_doc_max_bytes=0"]   # instead of project_untrust when the PR changes
#                                     # only AGENTS.md or AGENTS.override.md: no project AGENTS.md loads, the
#                                     # rest of the team's .codex/ does and the checkout stays trusted;
#                                     # [] = project_untrust then too
# project_mcp = "off"                 # the MCP servers of an unchanged .codex/config.toml (the team's): off
#                                     # turns them off like mcp_off, but for mcp_allow (each one a server you
#                                     # keep); allow keeps them all, outside code in every session
# name = []                         # codex has no name flag, so magnum types `rename` while it works
# rename = "/rename {title}"
# login_check = "codex login status"  # "" = no preflight
# login_ok = "text:Logged in"         # text:<substring> | regex:<expr> | json:<path> | "" (exit status 0)
# login_file = "auth.json"            # the CLI's login file, under the Codex home when relative: a login pause
#                                     # that a run proved (a reviewer's run or the judge's pane showed the login
#                                     # error) holds until login_check passes and this file changes (2h at most;
#                                     # a file written after the failed run leaves it to login_check), because
#                                     # `codex login status` reads the saved tokens and says logged in while a
#                                     # revoked refresh token fails every call; "" = the login check alone
# session_source = "herdr"            # herdr reports the session id; none = always start fresh
# on_permission_prompt = "deny"       # an approval prompt during a magnum run: deny answers No (never Yes;
#                                     # at most 10 per run, then it waits); wait leaves it to you
# after_deny_prompt = "magnum denied that command: ..."  # sent once when the agent stops after a deny,
#                                     # so it finishes the run without the command; "" = send nothing
# on_hooks_review = "trust_own"       # Codex's "Hooks need review" at start: trust_own trusts the hooks when
#                                     # the checkout declares none (.codex/hooks.json, hooks or plugins in
#                                     # .codex/config.toml), so all are yours; decline = never trust
#   [kinds.codex.env]
#   CODEX_HOME = "~/.codex"
#   [kinds.codex.health_patterns]     # case-insensitive regexps; a list replaces the built-in one
#   usage_limit = ['usage limit reached']   # also login_required, model_limit, overloaded
#   refused = ['flagged\s+for\s+possible\s+cyber\s*security\s+risk', ...]   # the provider's safety warnings
#                                     # (Codex's cybersecurity refusal, a usage-policy violation, abuse or a
#                                     # threat in its own ■/⚠ line): the round ends at once and the PR is
#                                     # flagged, never reviewed again (`magnum codex-flag clear` lifts it)
#
# [kinds.claude]
# args = ["--dangerously-skip-permissions"]  # only without a wrapper, as for codex
# resume = ["--resume", "{session}"]
# model = ["--model", "{model}"]
# effort = ["--effort", "{effort}"]   # without it the session runs at your own Claude Code effortLevel
# name = ["--name", "{title}"]
# login_check = "claude auth status"
# login_ok = "json:loggedIn"
# switch_model = "/model {model}"     # typed into the idle pane when its model hits its own limit ("You've reached
#                                     # your Fable limit"); "" = cannot switch, so that limit pauses the kind
# fallback_models = ["opus", "sonnet"]  # switched to in order, once each per run, then back after the limit ends
# default_model = ""                  # the model of claude roles without their own `model` ("" = the CLI's)
# reset_model = "default"             # the switch_model argument back to the CLI's default (no model set)
# exit_keys = ["/", "e", "x", "i", "t", "enter"]   # /exit, one key each (herdr's send-keys takes key combos,
#                                     # no word): a hard park (a fresh start's second try, an abort's last) sends
#                                     # them when Claude is still its pane's foreground process after two ctrl+c,
#                                     # waits 10s more, then closes that pane alone (never the workspace) and the
#                                     # session; [] = the hard park closes the pane straight away. The idle park's
#                                     # early park quits with one ctrl+c and them a second later, only when herdr
#                                     # shows the session's own conversation idle in the pane and the screen an
#                                     # bare prompt and no dialog, never closing a pane they leave running;
#                                     # [] = two ctrl+c there
# context_pattern = '(?:\((?P<used>\d{1,3})%\)|Context left until auto-compact: (?P<left>\d{1,3})%)'
#                                     # how full a session's context is, read from the newest match in the last
#                                     # status lines of its pane: a Go regexp with a group named used (percent
#                                     # used) or left (percent left: 100 minus it), here a status line's
#                                     # "418k/1m (41%)" and Claude Code's own warning; [pipeline] fix_compact_at
#                                     # compacts the fixer by it. "" = nothing to read: the kind's fixer is
#                                     # resumed as it is, never compacted nor started fresh for its context
# project_untrust = ["--setting-sources", "user"]   # when the PR changes the checkout's .claude/ or .mcp.json,
#                                     # or a CLAUDE.md, CLAUDE.local.md or AGENTS.md in any directory (against
#                                     # its merge base, files a round left there included, or when git cannot
#                                     # tell), every launch and resume loads your user settings only: none of
#                                     # the checkout's settings (hooks, env, plugins), MCP servers, skills,
#                                     # commands, agents, CLAUDE.md or AGENTS.md. A session that loaded them is
#                                     # parked before the checkout moves to a new head that changes them
#                                     # (Claude reloads them while it runs); [] = a changed .claude/ loads like
#                                     # any trusted project's. Claude has no project_docs_off
# mcp_off = true                      # every launch and resume passes mcp_strict: no MCP server of yours (user,
#                                     # local, project or plugin ones, claude.ai connectors); false = they load
# mcp_strict = ["--strict-mcp-config"]   # Claude Code turns servers off only all at once, so mcp_allow does not
#                                     # apply: to keep some, write them to a JSON file ({"mcpServers": {...}})
#                                     # and add "--mcp-config", "<its absolute path>" here. Claude Code refuses
#                                     # --strict-mcp-config under a managed-mcp.json: set mcp_off = false there
#
# [kinds.droid]                       # droid 0.232: no model, effort or name flag in interactive mode
# resume = ["--resume", "{session}"]
#
# [kinds.omp]                         # omp 18.4
# resume = ["--resume={session}"]
# model = ["--model={model}"]
# effort = ["--thinking={effort}"]

# The seven roles below are the built-in defaults written out; declaring any [[role]] here replaces the
# built-in list. Non-judge roles run in parallel unless `after` orders them; the judge runs last, reads
# their reports and posts the review.

[[role]]
name = "codex-judge"
kind = "codex"
judge = true                          # exactly one judge per watch
# model = "gpt-6.1-sol"               # the Codex model for this role (--model); empty = [kinds.codex]
#                                     # default_model, else codex's own default
effort = "xhigh"                      # -c model_reasoning_effort=xhigh (the zsh codex function passes the same)
rereview_effort = "high"              # re-reviews of new commits; codex sets effort at launch only, so a live
                                      # session is asked for it in the prompt ("" = effort)
max_subagents = 2                     # subagents the judge may have open at once (the kind's `subagents` args;
                                      # 0 = none, through `no_subagents`); on its own it started 53 in 36
                                      # sessions, 27% of the Codex spend. Codex caps open threads, not a total
max_session_rounds = 6                # review rounds one judge session serves on a PR, then the next round
                                      # starts it fresh (the recovery, which reads the earlier reviews and
                                      # threads from GitHub; the reviewers keep theirs). A Codex session resumed
                                      # round after round carries every round's context, and a cybersecurity
                                      # refusal flags the PR for good: one came in round 15 of a session with
                                      # 29M tokens of history. 0 = no limit (any session role may set it)
skill = "{{repo}}/skills/magnum-review/SKILL.md"   # without a checkout: the binary's built-in copy
prompt = "judge-initial.md"
rereview = "judge-rereview.md"
continue_prompt = "judge-continue.md"
recovery = "judge-recovery.md"
nudge = "judge-nudge.md"
own_pass = "judge-own-pass.md"        # its own pass, with the reviewers ([pipeline] judge_own_pass = "parallel")
output = "codex-judge.json"           # the result file in the round's report directory
timeout = "90m"
aliases = ["judge"]

[[role]]
name = "claude-review"
kind = "claude"
summary = "deep review for bugs, security and correctness"   # one line for [triage]: what the role checks
                                      # (a role without one is never dropped from a round)
effort = "high"                       # passed to /code-review by the prompt
rereview_effort = "medium"            # re-reviews of new commits: fewer, surer findings on a smaller delta
prompt = "claude-review.md"
rereview = "claude-rereview.md"
restart = "claude-restart.md"         # a push cut the review short; the round restarted on the new head
output = "claude-review.md"
timeout = "40m"
aliases = ["claude"]

[[role]]
name = "codex-review"
kind = "shell"                        # a shell pane, not an agent session
summary = "Codex's own static review of the diff"
tool = "codex"                        # codex's login check, pauses and health patterns apply
# model = "gpt-6.1-sol"               # passed by the command as -c model=gpt-6.1-sol (empty = codex's own model);
                                      # set it here or in a [spend.<level>] table, not in args, which come last and
                                      # would win over the level's model
effort = "high"                       # passed by the command as -c model_reasoning_effort=high, so `codex review`
                                      # never runs at your global Codex effort; args come after it and win
command = "{{.DBLockCommand}} codex review{{if .Model}} -c model={{.Model}}{{end}}{{if .Effort}} -c model_reasoning_effort={{.Effort}}{{end}}{{range .MCPOff}} {{.}}{{end}} --base {{if .BaseSHA}}{{.BaseSHA}}{{else}}{{.BaseRef}}{{end}}"
                                      # .DBLockCommand is `magnum db-lock --checkout <slot> --role codex-review --`:
                                      # codex review is sandboxed but reaches the slot's databases on localhost
                                      # (Rails boots and truncates them), so it takes its turn on them like the
                                      # other roles, and db-lock runs codex from PATH, not your shell function.
                                      # The model (when the role or its spend level has one) and the effort
                                      # follow as config overrides. A command of your own that leaves .Model
                                      # out refuses a model rather than dropping it. .MCPOff turns off your Codex MCP servers ([kinds.codex] mcp_off) and
                                      # keeps a PR's .codex/ and AGENTS.md changes out (project_untrust,
                                      # project_docs_off); then
                                      # the merge base (fixed), else the base ref (moves with the base branch)
args = []                             # appended shell-quoted
ok_status = [0]                       # exit statuses that count as a report; any other status fails the role
capture = "stdout"                    # the command's stdout is tee'd into output (stderr stays in the pane)
output = "codex-review.md"
timeout = "40m"
aliases = ["codex", "codex_review"]

[[role]]
name = "claude-simplify"
kind = "claude"
summary = "simplifications and refactors of the changed code"
runs = "first"                        # always | first (until it ran once, then on request) | manual | never
                                      # on request = `magnum review <ref> --role claude-simplify` (or --simplify)
rerun_min_lines = 150                 # runs again once this many code lines changed since its last run
                                      # (comments, blank lines, whitespace moves, docs and the lines of a merged
                                      # base branch do not count); 0 = never
prompt = "claude-simplify.md"           # read-only: four parallel angle reviews (reuse, simplification,
                                      # efficiency, altitude), then every qualifying proposal, ranked (the
                                      # judge posts at most [pipeline] max_simplifications, 5 by default,
                                      # or the [[repo]]'s); edits none
output = "claude-simplify.md"         # the proposals; no `after`, so it runs alongside the reviewers
timeout = "40m"
aliases = ["simplify"]

[[role]]
name = "claude-judge"                 # a second judge, held in reserve: a watch without roles = [...] runs its first
kind = "claude"                       # judge (codex-judge); [pipeline] judge_fallback (this role by default) switches
judge = true                          # a PR to it after a Codex refusal, and a watch's roles may name it instead
model = "opus"                        # Claude's safety classifier is not Codex's; "fable" for the strongest model
effort = "xhigh"
rereview_effort = "high"
max_session_rounds = 6
skill = "{{repo}}/skills/magnum-review/SKILL.md"
prompt = "judge-initial.md"
rereview = "judge-rereview.md"
continue_prompt = "judge-continue.md"
recovery = "judge-recovery.md"
nudge = "judge-nudge.md"
own_pass = "judge-own-pass.md"
output = "claude-judge.json"
timeout = "90m"

[[role]]
name = "claude-fix"                   # the fixer of the fix job (`fix_role` above): never part of a review round,
kind = "claude"                       # so a watch's roles do not list it. Its session is kept across fix runs like
fix = true                            # a reviewer's until you park it; max_session_rounds is refused on a fix role,
                                      # since a fix job is no round and nothing counts rounds for it
# identity = "me"                     # unset: the fixer acts as each watch's poll identity, your gh login in a
                                      # `magnum init` config. Its pane gets that GitHub env, so it pushes to the
                                      # PR's branch and answers the review's threads as you, not as the App that
                                      # posted the review. Set it in a [[role]] block named claude-fix to act as
                                      # another kind = "gh" [[identity]] (an App is refused; a poll identity that
                                      # is an App makes the fix job refuse to start)
model = "opus"
effort = "high"
skill = "{{repo}}/skills/magnum-fix/SKILL.md"   # the fix skill, copied at startup and embedded in the binary like the
                                      # judge's (without a checkout: the binary's built-in copy). An absolute
                                      # path points at your own
prompt = "fix.md"
output = "claude-fix.md"
timeout = "60m"

[[role]]
name = "claude-whiteboard"            # the writer of the whiteboard job (`whiteboard_role` above): never part of a
kind = "claude"                       # review round, so a watch's roles do not list it
whiteboard = true
# identity = "me"                     # unset: the writer acts as each watch's poll identity, your gh login in a
                                      # `magnum init` config; its pane's gh reads the PR's title as you (an App
                                      # is refused)
model = "opus"
effort = "medium"
prompt = "whiteboard.md"
output = "claude-whiteboard.md"
timeout = "30m"
args = ["--mcp-config", '{"mcpServers":{"whiteboard":{"command":"whiteboard","args":["mcp"]}}}']
                                      # the session gets the Whiteboard MCP server alone: the claude kind's
                                      # mcp_strict (--strict-mcp-config) keeps every other server out, your own
                                      # whiteboard plugin included. The `whiteboard` command must be on PATH

# Identities, watches and pools are personal: declare them in ~/.config/magnum/config.toml (its
# blocks are appended to this file). The examples below show every key.
#
# [[identity]]                            # who polls and who posts
# name = "me"
# kind = "gh"                             # your `gh auth login` account
# login = "your-login"
# no_findings_event = "APPROVE"           # APPROVE | COMMENT when the judge finds nothing
# dismiss_own_stale_change_requests = true  # a re-review with no blocking finding dismisses this identity's own earlier
#                                         # CHANGES_REQUESTED review of the PR ("Superseded by the newer Magnum review"),
#                                         # which would otherwise stay and keep blocking the author's merge. The default
#                                         # depends on the kind: true for an app, false for gh, whose reviews are your
#                                         # own account's, so set true to let magnum withdraw them. A change request you
#                                         # posted by hand (magnum request-changes), and any review after the PR was
#                                         # merged, are never dismissed; a failed dismissal (a missing permission) only
#                                         # warns. After a watch moves to another identity the new one's review also
#                                         # dismisses the old identity's change requests, if the old one has this on.
# review_footer = '''
# **Reviewed commit:** `{{.Short}}`
#
# <details><summary>ℹ️ About Magnum</summary>
#
# Automated review by [Magnum](https://github.com/zhuravel/magnum). Reply on a P0-P2 thread with `fixed`, `not a bug: <why>` or `won't fix: <why>`{{if .Simplify}}; simplifications are optional{{end}}. New pushes are re-reviewed automatically{{with .QuietHours}} (during {{.}} only small ones, by a short check){{end}}{{if .DraftsSkipped}}, drafts only on request{{end}}. A thread reply gets an answer without a push, and a review request for `{{.RequestLogin}}` starts a round.
#
# </details>'''
#                                         # the footer magnum appends to every review the identity posts once the review
#                                         # is verified, for the PR's author: the template above is the default of every
#                                         # identity that does not set its own; "" = no footer. A Go text/template of at
#                                         # most 2,000 characters, line breaks allowed, with .SHA and .Short (its first 10
#                                         # characters) of the reviewed commit, .Repo (owner/name), .Number, .Login (the
#                                         # posting login), .Simplify (the PR's watch runs a role aliased simplify), .Clean
#                                         # (no findings and no simplifications), .Event (APPROVE, COMMENT or
#                                         # REQUEST_CHANGES), .PostMerge, .DeltaCheck, .QuietHours ([daemon] quiet_hours
#                                         # with the daemon's UTC offset, "03:00-12:00 UTC+3"; "" when unset),
#                                         # .DraftsSkipped (the watch's include_drafts = false) and .RequestLogin (whose
#                                         # review request starts a round: your login, as poll_identity says; the
#                                         # posting login when no gh identity is declared). magnum starts it with
#                                         # <!-- magnum:footer --> and, editing the review again, replaces what follows
#                                         # that marker instead of adding a second footer. Dry runs get none.
#
# [[identity]]
# name = "reviewer-app"
# kind = "app"                            # a GitHub App; reviews appear as <slug>[bot]
# login = "your-app[bot]"
# app_id = 123456
# client_id = "Iv23liXXXXXXXXXXXXXX"
# installation_id = 12345678
# private_key_file = "~/.config/magnum/keys/reviewer-app.pem"   # the App's PEM (chmod 600); a relative path
#                                         # is under the config's directory; or private_key_env = "NAME", an
#                                         # env var holding the PEM's text or path (e.g. from a checkout's mise)
# no_findings_event = "COMMENT"           # never let a bot approval unlock a merge by accident
# blocking_event = "REQUEST_CHANGES"
# dismiss_own_stale_change_requests = true  # the default for an app (see above); false leaves a stale change request
#                                         # for a human to dismiss
#
# [[watch]]
# owner = "your-org"
# include = ["your-app"]                  # repository globs; ["*"] for the whole owner
# exclude = []
# identity = "reviewer-app"               # who posts
# poll_identity = "me"                    # who polls: a gh identity (your account) or an App, whose installation
#                                         # has a GitHub budget of its own; your login (review requests for you,
#                                         # your own PRs, the footer's .RequestLogin) is the poll identity's when
#                                         # it is a gh one, else auto_approve_as's, else the first gh identity's
# clone_root = "~/Projects"
# include_drafts = false                # a draft waits until ready for review, or until a review request for you, a
#                                       # posting identity or a request_teams team (one round per request), and the
#                                       # review footer says drafts are reviewed only on request; true: drafts too
# include_own = true                    # false: skip PRs authored by any of your logins (every gh identity and every
#                                       # watch's posting identity, the board's "mine"), not only the poll login
# skip_bot_authors = true
# allow_bot_authors = ["helper[bot]"]   # bots (GitHub logins, any case, with or without [bot]; app/helper is
#                                       # refused) whose PRs are reviewed although skip_bot_authors skips bots:
#                                       # an App that writes code for the team, not every dependency bot;
#                                       # skip_authors wins over it, and with skip_bot_authors = false it
#                                       # changes nothing (default: none; a [[repo]] block's adds to it)
# skip_authors = ["dependabot"]         # GitHub logins (any case, with or without [bot]; app/<name> is refused) whose PRs are skipped
# skip_labels = []
# skip_paths = ["docs/**", "**/*.md"]   # skip a PR when every changed file matches ("**" spans directories, "*" stays in one)
# skip_cross_repository = true
# skip_departed_authors = true          # skip branch PRs whose author (not a bot) is no longer an owner, member or collaborator (left the org)
# manual_repos = ["example"]            # repositories of the watch (names, no owner or glob) shown on the board but
#                                       # reviewed only when you ask (magnum review, r/R, the picker); default: none
# burst_pushes = 0                      # overrides [daemon] burst_quiet_period / burst_pushes / burst_window
# skip_trivial_deltas = []              # overrides [daemon] skip_trivial_deltas ([] = re-review every push)
# rereview_min_lines = 0                # overrides [daemon] rereview_min_lines / rereview_max_wait (0: no threshold)
# delta_check = false                   # overrides [daemon] delta_check (false: a small delta waits for a full round)
# own_min_rereview_interval = "4h"      # overrides [daemon] own_min_rereview_interval ("0" keeps the daemon's)
# judge_own_pass = "after"              # overrides [pipeline] judge_own_pass ("after": one judge prompt after the reviewers)
# related_lookback = "30d"              # overrides [pipeline] related_lookback / related_ignore ("0s" = open PRs only,
#                                       # unset = the pipeline's; [] = ignore no path)
# related_ignore = ["**/*.lock", "db/schema.rb"]
# request_teams = ["backend"]           # review requests for these team slugs start a round like one for you
# auto_approve = ["your-app"]           # repositories of the watch (names, or ["*"]) on whose PRs magnum posts YOUR
#                                       # approval once its review of the head leaves nothing to fix (default: none)
# auto_approve_as = "me"                # the gh identity of your own account (GitHub does not count an App's approval)
# auto_approve_body = "Approved after Magnum's review of {{.Short}}."   # one line: .Short (7 characters), .SHA,
#                                       # .ReviewURL, .Repo, .Number (unset: a default line linking the review);
#                                       # magnum adds its marker
# auto_approve_skip_authors = ["alice"] # GitHub logins (any case, with or without [bot]; app/<name> is refused) whose PRs magnum never
#                                       # approves as you on its own, however clean; A still approves them, an
#                                       # approval standing from before stays, GitHub never sees the list
#                                       # (default: none; a [[repo]] block's adds to it)
# auto_approve_authors = ["rev-ann"]    # when set, the only GitHub logins (matched as above) whose PRs magnum
#                                       # approves as you on its own, on every repository auto_approve names;
#                                       # auto_approve_skip_authors still wins; A still approves anyone's PR, an
#                                       # approval standing from before stays (default: none = every author;
#                                       # a [[repo]] block's replaces it for that repository)
# roles = ["codex-judge", "claude-review", "codex-review", "claude-simplify"]   # omitted or [] = every round role, the first judge only
# trackers = ["https://linear.app/your-org/issue/PR-{num}"]   # [board] trackers for this owner's PRs: an issue key
#                                       # prefix named here wins over [board]'s (another org's PR- in another tracker)
#
# [[pool]]                                # a big app with its own databases: a pool of warm slots
# repo = "your-org/your-app"
# main_clone = "~/Projects/your-app"
# slot_name = "review{n}"                 # slot names and paths are unique: two pools must not render the same
# slot_path = "~/Projects/your-app.review{n}"   # one (review1 in both), so give each pool its own prefix;
#                                         # a slot's database {slug}, which its setup writes to the
#                                         # tmp/.worktree-db-slug marker, is its name sanitized (every character
#                                         # but letters, digits and _ as _, at most 30): example-review1 →
#                                         # example_review1
# base = "master"
# min = 6
# max = 8
# idle_remove_after = "168h"              # a free slot above min goes once idle this long (the default when unset
#                                         # or 0; never negative; each removal is about 1 GB the next provision
#                                         # writes again)
# min_free_disk_gb = 15
# copy_files = ["mise.local.toml", "config/initializers/local.rb"]    # the local mise file is rendered, not
#                                         # copied: under the main clone's spelling, mise.local.toml or
#                                         # .mise.local.toml (dotted when both exist, as mise prefers it;
#                                         # mise.local.toml when there is none); a file magnum rendered under
#                                         # the other spelling is removed
# strip_env = ["GITHUB_PERSONAL_ACCESS_TOKEN"]  # dropped from the rendered local mise file (GitHub tokens always are)
# setup = ["bin/worktree-setup"]           # runs once per slot with the [pool.env] below
# teardown = ["bin/worktree-archive"]
# schema_paths = ["db/"]                 # a PR that changes these changes the databases' schema
# reset_db = ["bin/rails db:schema:load", "RAILS_ENV=test bin/rails db:schema:load", "bin/rails db:seed"]
#                                         # loads the checkout's schema into the slot's databases: before the
#                                         # reviewers when the files under schema_paths differ from those the
#                                         # databases were last loaded from (or the dev database's
#                                         # schema_migrations moved); a release keeps the databases as they are
# reset_db_on_schema_change = true        # false: reset_db only on release, back to the base schema (the
#                                         # reviewers of a PR that changes the schema run against the base one);
#                                         # before the reviewers it runs as the first readiness commands, through
#                                         # `mise exec` as on release (not the login shell, whose mise shims put the
#                                         # checkout's local mise file's env over the pool's), within 30m of its
#                                         # own, and ready_timeout starts after it
# post_checkout = ["bundle check >/dev/null || bundle install --jobs 4", "pnpm install --frozen-lockfile"]
#                                         # runs in the slot after a checkout or a release (mise exec, 30m) when
#                                         # the checkout's lockfiles or these commands differ from the last run's:
#                                         # Gemfile.lock, pnpm-lock.yaml, yarn.lock, package-lock.json, bun.lock,
#                                         # composer.lock, go.sum, Cargo.lock, poetry.lock, uv.lock (at the root;
#                                         # one the checkout lacks counts for nothing), so an edit here reruns
#                                         # them at each slot's next checkout; the setup counts as their first run
# databases = ["your_app_development__{slug}", "your_app_test__{slug}"]   # each must end in __{slug}
# prepare = ["bin/rails db:test:prepare"] # readiness: run in the checkout before the reviewers of every
# ready = ["bin/rails runner 'ActiveRecord::Base.connection'"]  # round (`zsh -lc`, the slot's env), then
# ready_timeout = "5m"                    # the probes (exit 0 = ready), all within ready_timeout, then a
#                                         # check that the shell runs the pinned Ruby; failures go to the
#                                         # judge, they never stop the round
#
#   [pool.env]
#   WT_BRANCH = "{slot}"                  # the name your app derives its databases from

# Per-PR worktrees (repos without a [[pool]]) run as workspace "magnum-pr-<N>": WT_BRANCH is exported to
# their hooks and agents, the outranking workspace-name variables are blanked, and the main clone's
# local mise file is rendered into them with GitHub tokens stripped. Without a [[repo]] block the main
# clone's .config/wt.toml hooks run ([post-create]/[post-start] after creation, [pre-remove] before
# removal). A [[repo]] block (the repo must be watched) supplies commands instead; see the README.
# Its no_findings_event and blocking_event override the posting identity's verdicts for the repo, and a
# block with only those, keep_approvals, stakes, max_simplifications, auto_approve_skip_authors,
# auto_approve_authors, allow_bot_authors, required_checks, trackers and the readiness keys (prepare, ready,
# ready_timeout; each replaces the pool's) is valid for a [[pool]] repo too.
#
# [[repo]]
# repo = "your-org/your-app"
# no_findings_event = "COMMENT"           # APPROVE | COMMENT; default: the identity's
# blocking_event = "REQUEST_CHANGES"      # REQUEST_CHANGES | COMMENT; default: the identity's
# keep_approvals = false                  # true: keep an App's approval when the PR gets new commits
#                                         # (default: dismissed until the re-review posts; also on [[watch]])
# stakes = ""                             # what the repository puts at risk, one line of at most 300 characters,
#                                         # such as "A SaaS on the public internet: merchants' money and shoppers'
#                                         # personal data."; the judge sizes each harm against it (`stakes` in its
#                                         # prompts, a sentence in claude-review's), never against a stakes block
#                                         # in the checkout; default: the watch's (also on [[watch]]), else none
# max_simplifications = 0                 # how many simplifications the judge posts at most on this repository's
#                                         # PRs, 0 to 10; 0 = [pipeline]'s (5 by default)
# auto_approve_skip_authors = ["alice"]   # added to the watch's list for this repository's PRs alone
# auto_approve_authors = ["rev-ann"]      # replaces the watch's list for this repository's PRs alone: only
#                                         # these authors' PRs are approved as you on their own (unset or []:
#                                         # the watch's)
# allow_bot_authors = ["helper[bot]"]     # added to the watch's list for this repository's PRs alone
# required_checks = ["Completion"]        # checks a PR must pass to be ready (name globs; "workflow:<glob>" = every
#                                         # check of each Actions workflow whose file, "ci.yml", or declared name,
#                                         # "CI", it matches); replaces the list GitHub's rulesets declare, which
#                                         # magnum reads by itself; needed where GitHub will not tell (private repos
#                                         # on a free plan); the board shows their state, and the automatic
#                                         # approval counts only these checks (a failing check outside the list
#                                         # never holds it; without the key every check counts), one run per
#                                         # workflow file and name, a commit status apart from a check run of its
#                                         # name; it never approves a PR that changes .github/workflows/ or
#                                         # .github/actions/ on its own
# trackers = ["https://your-org.atlassian.net/browse/APP-{num}"]   # [board] trackers for this repository's PRs;
#                                         # its key prefixes win over the watch's and [board]'s
# prepare = ["bin/rails db:test:prepare"] # readiness, as on [[pool]]
# ready = ["bin/rails runner 'ActiveRecord::Base.connection'"]
# ready_timeout = "5m"
# setup = ["bin/setup --database"]        # replaces wt.toml's post-create/post-start hooks
# teardown = ["bin/drop-database"]        # replaces wt.toml's pre-remove hooks; failures are logged
# copy_files = ["config/master.key"]      # copied from the main clone when present
# strip_env = ["STRIPE_SECRET_KEY"]       # dropped from the rendered local mise file
# wt_hooks = true                         # false: ignore .config/wt.toml without replacing it
#
#   [repo.env]                            # {slug} = magnum-pr-<N>, {path} = worktree, {clone} = main clone
#   DATABASE_NAME = "your_app_{slug}"
